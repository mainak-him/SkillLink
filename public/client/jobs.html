<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillLink - My Jobs</title>
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
<div id="nav-container"></div>
<main class="page-content">
  <div class="section-head">
    <div class="section-title">Manage My Jobs</div>
    <button class="btn btn-primary" onclick="document.getElementById('post-modal').classList.add('open')">+ Post New Job</button>
  </div>

  <div class="filter-bar mb-4">
    <select id="status-filter" onchange="loadJobs()">
      <option value="all">All Statuses</option>
      <option value="open">Open</option>
      <option value="assigned">In Progress</option>
      <option value="completed">Needs Confirmation</option>
      <option value="confirmed">Confirmed</option>
      <option value="closed">Closed / Paid</option>
      <option value="disputed">Disputed</option>
    </select>
  </div>

  <div id="jobs-list"><div class="text-muted">Loading jobs...</div></div>
</main>
<div id="toast"></div>

<!-- Rating modal -->
<div class="modal-overlay" id="rate-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('rate-modal').classList.remove('open')">×</button>
    <div class="modal-title">Rate the Artisan</div>
    <div class="form-group" style="margin-top:20px">
      <label>Your Rating</label>
      <div id="rate-stars" style="display:flex;margin-top:12px"></div>
    </div>
    <div class="form-group">
      <label>Comment (optional)</label>
      <textarea id="rate-comment" rows="3" placeholder="Share your experience..."></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-primary" onclick="submitRating()">Submit Rating</button>
      <button class="btn btn-outline" onclick="document.getElementById('rate-modal').classList.remove('open')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="payment-modal">
  <div class="modal-box" style="position:relative;max-width:440px">
    <button class="modal-close" onclick="document.getElementById('payment-modal').classList.remove('open')">×</button>
    <div class="modal-title">Confirm Payment</div>
    <div class="form-group" style="margin-top:16px">
      <label>Job</label>
      <div id="payment-job-title" class="form-hint"></div>
    </div>
    <div class="form-group">
      <label>Amount</label>
      <div id="payment-job-amount" class="form-hint"></div>
    </div>
    <div class="form-group">
      <label>Payment Reference *</label>
      <input type="text" id="payment-reference" placeholder="e.g. MPESA12345" required>
    </div>
    <div id="payment-err" class="form-error" style="display:none"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="payment-submit" class="btn btn-primary" onclick="submitPayment()">Save Payment Reference</button>
      <button class="btn btn-outline" onclick="document.getElementById('payment-modal').classList.remove('open')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="post-modal">
  <div class="modal-box" style="position:relative">
    <button class="modal-close" onclick="document.getElementById('post-modal').classList.remove('open')">×</button>
    <div class="modal-title">Post a New Job</div>
    <form id="post-job-form">
      <div class="form-group">
        <label>Job Title *</label>
        <input type="text" id="j-title" placeholder="e.g. Fix leaking kitchen pipe" required>
      </div>
      <div class="form-group">
        <label>Required Skill *</label>
        <!-- FIX #2: Tiling and General Repairs included, matching backend exactly -->
        <select id="j-skill" required>
          <option value="">Select trade...</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Masonry</option>
          <option>Carpentry</option>
          <option>Painting</option>
          <option>Welding</option>
          <option>Tiling</option>
          <option>General Repairs</option>
        </select>
        <div id="j-skill-hint" class="form-hint">Need help selecting a skill? Describe your issue and we’ll suggest one.</div>
      </div>
      <div class="form-group">
        <label>Description *</label>
        <textarea id="j-desc" rows="3" placeholder="Provide details about the issue or task..." required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Min Budget (KES)</label>
          <input type="number" id="j-min" placeholder="e.g. 1000">
        </div>
        <div class="form-group">
          <label>Max Budget (KES)</label>
          <input type="number" id="j-max" placeholder="e.g. 5000">
        </div>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="j-emergency" style="width:auto;margin-right:6px"> Mark job as urgent</label>
      </div>
      <div class="form-group">
        <label>Location *</label>
        <select id="j-location-select" onchange="setJobLocationFromPreset()" style="margin-bottom:10px;">
          <option value="">Choose a nearby area</option>
          <option value="Donholm" data-lat="-1.298" data-lng="36.862">Donholm</option>
          <option value="Westlands" data-lat="-1.265" data-lng="36.806">Westlands</option>
          <option value="Karen" data-lat="-1.302" data-lng="36.738">Karen</option>
          <option value="CBD" data-lat="-1.283" data-lng="36.816">Nairobi CBD</option>
          <option value="Gigiri" data-lat="-1.260" data-lng="36.803">Gigiri</option>
          <option value="Eastlands" data-lat="-1.300" data-lng="36.876">Eastlands</option>
          <option value="Thika Road" data-lat="-1.249" data-lng="36.876">Thika Road</option>
        </select>
        <div class="form-row" style="margin-bottom:10px; gap:10px; align-items:flex-end;">
          <button type="button" class="btn btn-outline btn-sm" onclick="detectJobLocation()">Use current location</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="useProfileLocation()">Use profile location</button>
        </div>
        <input type="text" id="j-loc" placeholder="Selected address" readonly style="margin-bottom:6px">
        <input type="hidden" id="j-lat"><input type="hidden" id="j-lng">
        <div id="j-loc-status" class="form-hint" style="margin-top:4px">Select a location or detect it automatically.</div>
      </div>
      <div id="post-err" class="form-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary w-full" id="post-btn">Post Job</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (!Auth.check('client')) throw '';
  renderNav('client');

  let profileLocation = null;
  let paymentJobId = null;
  loadProfileLocation();

  async function loadProfileLocation() {
    try {
      const me = await api('/users/me');
      if (me.location_lat && me.location_lng) {
        profileLocation = {
          lat: +me.location_lat,
          lng: +me.location_lng,
          name: me.location_name || 'Your profile location'
        };
      }
    } catch (e) {
      console.warn('Profile location unavailable:', e.message);
    }
  }

  // FIX #6: highlightJobFromUrl called reliably after every render
  function highlightJobFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('job');
    if (!jobId) return;
    const jobCard = document.querySelector(`.job-card[data-job-id="${jobId}"]`);
    if (jobCard) {
      jobCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      jobCard.classList.add('job-card-highlight');
      setTimeout(() => jobCard.classList.remove('job-card-highlight'), 2000);
    }
  }

  async function loadJobs() {
    const status = document.getElementById('status-filter').value;
    const el = document.getElementById('jobs-list');
    el.innerHTML = '<div class="text-muted">Loading...</div>';
    
    try {
      const jobs = await api(`/jobs?status=${status}`);
      if (!jobs.length) {
        el.innerHTML = '<div class="empty-state"><p>No jobs found for this filter.</p></div>';
        return;
      }
      
      el.innerHTML = '<div class="job-list">' + jobs.map(j => {
        let actions = '';
        if (j.status === 'open') actions = `<button class="btn btn-danger btn-sm" onclick="deleteJob(${j.job_id})">Delete</button>`;
        if (j.status === 'completed') actions = `
          <button class="btn btn-success btn-sm" onclick="confirmJob(${j.job_id})">Confirm Work Done</button>
          <button class="btn btn-danger btn-sm" onclick="raiseDispute(${j.job_id})">Raise Dispute</button>
        `;
        if (j.status === 'confirmed' && j.quoted_price && j.payment_status !== 'paid') actions = `<button class="btn btn-primary btn-sm" onclick="openPaymentModal(${j.job_id}, ${j.quoted_price})">Confirm Payment</button>`;
        if (j.status === 'closed' && j.payment_status === 'paid') actions = `<button class="btn btn-primary btn-sm" onclick="openRateModal(${j.job_id})">Rate Artisan</button>`;
        
        let artisanInfo = j.assigned_artisan_id
          ? `<div style="font-size:.8rem;color:var(--text-l);margin-top:6px">Assigned to: <strong>${j.artisan_name}</strong> (${j.artisan_phone})</div>`
          : '';

        return `
          <div class="job-card" data-job-id="${j.job_id}">
            <div class="job-card-top">
              <div class="job-title">${j.job_title}</div>
              ${statusPill(j.status)}
            </div>
            <div class="job-meta">
              <span class="pill pill-blue">${j.required_skill}</span>
              <span class="pill pill-gray">Location: ${j.job_location_name || 'Not set'}</span>
              ${j.is_emergency ? '<span class="pill pill-red">Urgent</span>' : ''}
              ${j.quoted_price ? `<span class="pill pill-green">Quoted: ${fmtMoney(j.quoted_price)}</span>` : ''}
              ${j.payment_status === 'paid' ? '<span class="pill pill-green">Paid</span>' : ''}
            </div>
            <div class="job-desc">${j.job_description}</div>
            ${artisanInfo}
            <div class="job-actions">${actions}</div>
            ${j.status === 'completed' ? '<div class="form-hint" style="margin-top:12px">Please confirm within 48 hours or the system will auto-confirm.</div>' : ''}
            ${j.payment_status==='paid' && j.payment_reference ? `<div class="form-hint" style="margin-top:12px">Payment ref: ${j.payment_reference}</div>` : ''}
          </div>
        `;
      }).join('') + '</div>';

      // FIX #6: always call after render
      highlightJobFromUrl();
    } catch (e) {
      el.innerHTML = `<div class="form-error">${e.message}</div>`;
    }
  }

  async function detectJobLocation() {
    try {
      const pos = await getCurrentPosition();
      const { latitude, longitude } = pos.coords;
      document.getElementById('j-lat').value = latitude;
      document.getElementById('j-lng').value = longitude;
      const name = await reverseGeocode(latitude, longitude);
      document.getElementById('j-loc').value = name;
      document.getElementById('j-location-select').value = '';
      document.getElementById('j-loc-status').textContent = 'Coordinates captured.';
    } catch {
      if (profileLocation) {
        useProfileLocation();
      } else {
        document.getElementById('j-loc-status').textContent = 'Could not detect GPS. Please check your browser location permissions.';
        toast('Unable to detect location. Please enable GPS or use your profile location.', 'warn');
      }
    }
  }

  function setJobLocationFromPreset() {
    const select = document.getElementById('j-location-select');
    const option = select.options[select.selectedIndex];
    const name = option.value;
    if (!name) {
      document.getElementById('j-loc').value = '';
      document.getElementById('j-lat').value = '';
      document.getElementById('j-lng').value = '';
      document.getElementById('j-loc-status').textContent = 'Select a location or detect it automatically.';
      return;
    }
    const lat = option.dataset.lat;
    const lng = option.dataset.lng;
    document.getElementById('j-loc').value = `${name}, Nairobi`;
    document.getElementById('j-lat').value = lat;
    document.getElementById('j-lng').value = lng;
    document.getElementById('j-loc-status').textContent = 'Location selected from nearby areas.';
  }

  function useProfileLocation() {
    if (!profileLocation) {
      document.getElementById('j-loc-status').textContent = 'No saved profile location available. Please select or detect location.';
      toast('No saved profile location is available yet.', 'warn');
      return;
    }
    document.getElementById('j-location-select').value = '';
    document.getElementById('j-loc').value = profileLocation.name;
    document.getElementById('j-lat').value = profileLocation.lat;
    document.getElementById('j-lng').value = profileLocation.lng;
    document.getElementById('j-loc-status').textContent = 'Using saved profile location.';
  }

  function suggestJobSkill() {
    const desc = document.getElementById('j-desc').value.toLowerCase();
    const skillSelect = document.getElementById('j-skill');
    if (skillSelect.value) return;
    const hints = [
      { keywords: ['leak', 'pipe', 'tap', 'drain', 'bathroom', 'flush', 'water'], skill: 'Plumbing' },
      { keywords: ['light', 'socket', 'switch', 'electric', 'power', 'cable'], skill: 'Electrical' },
      { keywords: ['brick', 'cement', 'wall', 'floor', 'masonry'], skill: 'Masonry' },
      { keywords: ['door', 'wood', 'cabinet', 'woodwork', 'carpentry'], skill: 'Carpentry' },
      { keywords: ['paint', 'decor', 'wall paint', 'color'], skill: 'Painting' },
      { keywords: ['weld', 'metal', 'gate', 'iron'], skill: 'Welding' },
      { keywords: ['tile', 'tiling', 'ceramic'], skill: 'Tiling' }
    ];
    const hint = hints.find(h => h.keywords.some(k => desc.includes(k)));
    const hintEl = document.getElementById('j-skill-hint');
    if (hint) {
      hintEl.textContent = `Suggested skill: ${hint.skill}. You can change it if needed.`;
    } else {
      hintEl.textContent = 'Need help selecting a skill? Choose the closest category or General Repairs.';
    }
  }

  document.getElementById('j-desc').addEventListener('input', suggestJobSkill);

  document.getElementById('post-job-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('post-btn');
    const errEl = document.getElementById('post-err');
    errEl.style.display = 'none';

    if (!document.getElementById('j-lat').value && profileLocation) {
      document.getElementById('j-lat').value = profileLocation.lat;
      document.getElementById('j-lng').value = profileLocation.lng;
      document.getElementById('j-loc').value = profileLocation.name;
      document.getElementById('j-loc-status').textContent = 'Using your profile location by default.';
      toast('Using your saved profile location for this job.', 'info');
    }
    if (!document.getElementById('j-lat').value) {
      errEl.textContent = 'Please select or detect a valid location so artisans can find you on the map.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = 'Posting...';
    try {
      await api('/jobs', 'POST', {
        job_title: document.getElementById('j-title').value,
        required_skill: document.getElementById('j-skill').value,
        job_description: document.getElementById('j-desc').value,
        budget_min: document.getElementById('j-min').value || 0,
        budget_max: document.getElementById('j-max').value || 0,
        job_location_name: document.getElementById('j-loc').value,
        job_location_lat: document.getElementById('j-lat').value,
        job_location_lng: document.getElementById('j-lng').value,
        is_emergency: document.getElementById('j-emergency').checked ? 1 : 0
      });
      toast('Job posted successfully!', 'success');
      document.getElementById('post-modal').classList.remove('open');
      e.target.reset();
      loadJobs();
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Post Job';
    }
  });

  async function deleteJob(id) {
    if (!confirm('Delete this job posting?')) return;
    try {
      await api(`/jobs/${id}`, 'DELETE');
      toast('Job deleted', 'info');
      loadJobs();
    } catch (e) { toast(e.message, 'error'); }
  }

  function openPaymentModal(id, quotedPrice) {
    paymentJobId = id;
    document.getElementById('payment-job-title').textContent = `Job #${id}`;
    document.getElementById('payment-job-amount').textContent = fmtMoney(quotedPrice);
    document.getElementById('payment-reference').value = '';
    document.getElementById('payment-err').style.display = 'none';
    document.getElementById('payment-modal').classList.add('open');
  }

  async function submitPayment() {
    const ref = document.getElementById('payment-reference').value.trim();
    const errEl = document.getElementById('payment-err');
    if (!ref) {
      errEl.textContent = 'Enter the payment reference or bank code.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('payment-submit');
    btn.disabled = true;
    try {
      await api(`/jobs/${paymentJobId}/payment`, 'PUT', { payment_reference: ref });
      toast('Payment confirmed with reference saved.', 'success');
      document.getElementById('payment-modal').classList.remove('open');
      loadJobs();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  async function confirmJob(id) {
    if (!confirm('Confirm the artisan has completed the work? They will be notified to quote their final price.')) return;
    try {
      await api(`/jobs/${id}/confirm`, 'PUT');
      toast('Work confirmed! Awaiting artisan quote.', 'success');
      loadJobs();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function raiseDispute(id) {
    if (!confirm('Raise a dispute for this job? The artisan will be notified.')) return;
    try {
      await api(`/jobs/${id}/dispute`, 'PUT');
      toast('Dispute raised. The artisan will be notified.', 'info');
      loadJobs();
    } catch (e) { toast(e.message, 'error'); }
  }

  let currentJobToRate = null;
  function openRateModal(jobId) {
    currentJobToRate = jobId;
    document.getElementById('rate-modal').classList.add('open');
    document.getElementById('rate-comment').value = '';
    document.getElementById('rate-stars').innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.innerHTML = '★';
      star.style.cssText = 'cursor:pointer;font-size:1.8rem;color:#ddd;margin:0 4px;';
      star.dataset.star = i;
      star.addEventListener('click', () => updateStarDisplay(i));
      star.addEventListener('mouseover', () => hoverStarDisplay(i));
      star.addEventListener('mouseout', () => updateStarDisplay(document.querySelectorAll('#rate-stars span.active').length));
      document.getElementById('rate-stars').appendChild(star);
    }
  }

  function updateStarDisplay(count) {
    document.querySelectorAll('#rate-stars span').forEach((s, i) => {
      s.classList.toggle('active', i < count);
      s.style.color = i < count ? '#ffc107' : '#ddd';
    });
  }

  function hoverStarDisplay(count) {
    document.querySelectorAll('#rate-stars span').forEach((s, i) => {
      s.style.color = i < count ? '#ffc107' : '#ddd';
    });
  }

  async function submitRating() {
    const rating = document.querySelectorAll('#rate-stars span.active').length;
    const comment = document.getElementById('rate-comment').value;
    if (!rating) { toast('Please select a rating', 'error'); return; }
    try {
      await api(`/jobs/${currentJobToRate}/rate`, 'POST', { rating, comment });
      toast('Thank you for rating!', 'success');
      document.getElementById('rate-modal').classList.remove('open');
      loadJobs();
    } catch (e) { toast(e.message, 'error'); }
  }

  loadJobs();
  // FIX #4: refreshWithScroll kept for job list (scroll position matters), 30s
  setInterval(() => {
    if (!document.querySelector('.modal-overlay.open')) refreshWithScroll(loadJobs);
  }, 30000);
</script>
</body>
</html>
